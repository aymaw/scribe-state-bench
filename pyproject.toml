[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-state-bench"
version = "0.1.0"
description = "Synthetic clinical transcript parsing and multi-turn dialogue state evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Ayma Waqar"}]
dependencies = [
  "torch==2.9.0",
  "numpy==2.3.4"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "httpx==0.28.1", "build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
